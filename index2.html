<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:#071407;color:#e8f5e9;min-height:100vh;overflow-x:hidden;}

/* BG */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;transition:background 1.5s ease;}
.particle{position:absolute;border-radius:50%;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(100vh);opacity:0}10%{opacity:1}90%{opacity:.6}100%{transform:translateY(-5vh);opacity:0}}

/* Progress */
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,#2ecc71,#1abc9c);box-shadow:0 0 10px #2ecc71;transition:width .8s ease;z-index:20;}

/* App */
#app{position:relative;z-index:5;min-height:100vh;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;}
.screen{display:none;width:100%;max-width:600px;max-height:calc(100vh - 24px);overflow-y:auto;}
.screen.active{display:block;}
.screen::-webkit-scrollbar{width:4px;}
.screen::-webkit-scrollbar-track{background:transparent;}
.screen::-webkit-scrollbar-thumb{background:rgba(46,204,113,.3);border-radius:2px;}
.card{background:rgba(4,15,4,.88);border:1px solid rgba(46,204,113,.28);border-radius:20px;padding:clamp(16px,2.5vh,32px) clamp(16px,3vw,28px);backdrop-filter:blur(14px);box-shadow:0 8px 48px rgba(0,0,0,.65),inset 0 0 60px rgba(46,204,113,.03);animation:cIn .55s cubic-bezier(.34,1.56,.64,1);}
@keyframes cIn{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}

/* START */
.s-icon{font-size:68px;text-align:center;margin-bottom:14px;animation:bob 2.2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.s-title{text-align:center;font-size:1.9rem;font-weight:900;color:#2ecc71;text-shadow:0 0 20px rgba(46,204,113,.5);margin-bottom:8px;line-height:1.3;}
.s-sub{text-align:center;color:#81c784;font-size:.88rem;line-height:1.9;margin-bottom:22px;}
.tags{text-align:center;margin-bottom:28px;}
.tag{display:inline-block;background:rgba(46,204,113,.13);border:1px solid rgba(46,204,113,.35);color:#2ecc71;font-size:.72rem;padding:4px 11px;border-radius:20px;margin:2px;}

/* TRANSITION */
#trans{position:fixed;inset:0;z-index:100;background:#071407;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;opacity:0;pointer-events:none;transition:opacity .35s ease;}
#trans.show{opacity:1;pointer-events:all;}
#trans svg{width:min(90vw,520px);height:auto;}
.trans-label{color:#2ecc71;font-size:.9rem;letter-spacing:3px;margin-top:18px;opacity:0;transition:opacity .5s ease .3s;}
#trans.show .trans-label{opacity:1;}
.dots span{animation:db 1s infinite;} .dots span:nth-child(2){animation-delay:.2s;} .dots span:nth-child(3){animation-delay:.4s;}
@keyframes db{0%,100%{opacity:.2}50%{opacity:1}}

/* QUESTION */
.q-depth{font-size:.72rem;color:#4caf50;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.q-row{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;}
.q-n{font-size:2rem;font-weight:900;color:#2ecc71;}
.q-tot{font-size:.85rem;color:#4caf50;}
.q-scene{background:rgba(46,204,113,.07);border-left:3px solid #2ecc71;padding:11px 15px;border-radius:8px;font-size:.83rem;color:#a5d6a7;margin-bottom:18px;line-height:1.75;font-style:italic;}
.q-text{font-size:1.1rem;font-weight:700;line-height:1.75;margin-bottom:22px;color:#e8f5e9;}
.opts{display:flex;flex-direction:column;gap:11px;}
.opt{background:rgba(46,204,113,.06);border:1px solid rgba(46,204,113,.22);color:#c8e6c9;font-size:.92rem;padding:15px 18px;border-radius:11px;cursor:pointer;text-align:left;transition:all .22s ease;font-family:inherit;line-height:1.5;}
.opt:hover{background:rgba(46,204,113,.17);border-color:#2ecc71;color:#fff;transform:translateX(5px);box-shadow:0 4px 18px rgba(46,204,113,.18);}
.opt.sel{background:rgba(46,204,113,.28);border-color:#2ecc71;color:#fff;transform:translateX(5px);}

/* RESULT */
.r-animal{font-size:76px;text-align:center;margin-bottom:10px;animation:rIn .75s cubic-bezier(.34,1.56,.64,1);}
@keyframes rIn{from{transform:scale(0) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.r-type{text-align:center;font-size:.85rem;color:#4caf50;letter-spacing:3px;margin-bottom:4px;}
.r-name{text-align:center;font-size:1.7rem;font-weight:900;color:#2ecc71;text-shadow:0 0 18px rgba(46,204,113,.45);margin-bottom:18px;}
.r-desc{background:rgba(46,204,113,.06);border-left:3px solid #2ecc71;padding:15px 18px;border-radius:8px;font-size:.9rem;line-height:1.85;color:#c8e6c9;margin-bottom:18px;}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px;}
.r-cell{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.18);border-radius:10px;padding:11px;text-align:center;}
.r-clabel{font-size:.68rem;color:#4caf50;letter-spacing:1px;margin-bottom:3px;}
.r-cval{font-size:.87rem;font-weight:700;color:#a5d6a7;}
.axes{margin-bottom:22px;}
.ax-row{margin-bottom:10px;}
.ax-lbs{display:flex;justify-content:space-between;font-size:.75rem;color:#4caf50;margin-bottom:3px;}
.ax-track{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden;}
.ax-fill{height:100%;background:linear-gradient(90deg,#2ecc71,#1abc9c);border-radius:4px;transition:width 1.1s ease .4s;width:0%;}

/* BUTTONS */
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#2ecc71,#27ae60);border:none;border-radius:11px;color:#fff;font-size:.97rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .22s;box-shadow:0 4px 18px rgba(46,204,113,.28);letter-spacing:1px;margin-top:4px;}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(46,204,113,.38);}
.btn2{width:100%;padding:13px;background:transparent;border:1px solid rgba(46,204,113,.38);border-radius:11px;color:#4caf50;font-size:.92rem;cursor:pointer;font-family:inherit;margin-top:9px;transition:all .22s;letter-spacing:1px;}
.btn2:hover{background:rgba(46,204,113,.1);color:#2ecc71;}
</style>
</head>

// ─── PARTICLES ────────────────────────────────────────
function initParticles(){
  const bg=document.getElementById('bg');
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='particle';
    const sz=2+Math.random()*3;
    p.style.cssText=`width:${sz}px;height:${sz}px;background:rgba(${100+Math.random()*60},255,${100+Math.random()*60},${.3+Math.random()*.4});left:${Math.random()*100}%;animation-duration:${9+Math.random()*12}s;animation-delay:${Math.random()*10}s;`;
    bg.appendChild(p);
  }
}

// ─── QUIZ LOGIC ────────────────────────────────────────
function getDepthLabel(q){
  if(q<3) return 'DEPTH 1 — 🏕️ 入口付近';
  if(q<6) return 'DEPTH 2 — 🌿 深い茂みへ';
  if(q<9) return 'DEPTH 3 — 🦜 ジャングル深部';
  return 'DEPTH 4 — 🌸 謎の秘境';
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function startQuiz(){
  sc={A:{M:0,X:0},B:{T:0,S:0},C:{L:0,F:0}};
  cur=0; selVal=null;
  showScreen('question');
  renderQ();
}

function renderQ(){
  const q=QS[cur];
  document.getElementById('prog').style.width=(cur/QS.length*100)+'%';
  document.getElementById('qDepth').textContent=getDepthLabel(cur);
  document.getElementById('qNum').textContent=String(cur+1).padStart(2,'0');
  document.getElementById('qScene').textContent=q.scene;
  document.getElementById('qText').textContent=q.text;
  const el=document.getElementById('opts');
  el.innerHTML=''; selVal=null;
  q.opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.t;
    b.onclick=()=>pick(o.v,b);
    el.appendChild(b);
  });
}

function pick(val,btn){
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); selVal=val;
  setTimeout(()=>{
    const q=QS[cur];
    sc[q.ax][val]++;
    cur++;
    const sceneIdx=Math.min(Math.floor(cur/(QS.length/5)),4);
    if(cur>=QS.length) showTrans(4,()=>showResult());
    else showTrans(sceneIdx,()=>renderQ());
  },320);
}

function showTrans(idx,cb){
  const overlay=document.getElementById('trans');
  const sc2=SCENES[idx];
  sc2.draw(document.getElementById('transSvg'));
  document.getElementById('transLabel').textContent=sc2.label;
  overlay.classList.add('show');
  setTimeout(()=>{overlay.classList.remove('show');setTimeout(cb,350);},1300);
}

function getType(){
  const A=sc.A.M>=sc.A.X?'M':'X';
  const B=sc.B.T>=sc.B.S?'T':'S';
  const C=sc.C.L>=sc.C.F?'L':'F';
  const key=A+B+C;
  const map={
    MTL:'MTL',MTF:'MTF',MTS:'MTS',MSL:'MTL',MSF:'MTS',
    XTL:'XTL',XTF:'XTF',XSL:'XML',XSF:'XTF',
    XML:'XML',XXL:'XXL',MXF:'MXF',MXL:'MTL'
  };
  return TYPES[map[key]||'XTL'];
}

function showResult(){
  document.getElementById('prog').style.width='100%';
  const t=getType();
  document.getElementById('rAnimal').textContent=t.emoji;
  document.getElementById('rType').textContent=t.sub;
  document.getElementById('rName').textContent=t.name+' タイプ';
  document.getElementById('rTags').innerHTML=t.tags.map(g=>`<span class="tag">${g}</span>`).join('');
  // Axes
  const totA=QS.filter(q=>q.ax==='A').length;
  const totB=QS.filter(q=>q.ax==='B').length;
  const totC=QS.filter(q=>q.ax==='C').length;
  document.getElementById('axes').innerHTML=[
    {l:'計画的 📋',r:'直感的 🔮',pct:Math.round(sc.A.M/totA*100)},
    {l:'仲間と ☀️',r:'一人で 🌙',pct:Math.round(sc.B.T/totB*100)},
    {l:'論理派 🧠',r:'感性派 💚',pct:Math.round(sc.C.L/totC*100)},
  ].map(a=>`
    <div class="ax-row">
      <div class="ax-lbs"><span>${a.l}</span><span>${a.r}</span></div>
      <div class="ax-track"><div class="ax-fill" style="width:${a.pct}%"></div></div>
    </div>`).join('');
  document.getElementById('rDesc').textContent=t.desc;
  document.getElementById('rGrid').innerHTML=t.cells.map(([l,v])=>`
    <div class="r-cell"><div class="r-clabel">${l}</div><div class="r-cval">${v}</div></div>`).join('');
  showScreen('result');
}

function doShare(){
  const t=getType();
  const txt=`🌿 ジャングル探検性格診断\n\n私は「${t.name}」タイプ ${t.emoji}\n${t.sub}\n\n${t.tags.join(' ')}\n\n#ジャングル探検診断 #学祭`;
  if(navigator.share) navigator.share({title:'ジャングル探検 性格診断',text:txt});
  else navigator.clipboard.writeText(txt).then(()=>alert('結果をコピーしました！'));
}

function restartQuiz(){
  showTrans(0,()=>{showScreen('start');document.getElementById('prog').style.width='0%';});
}

function checkPw(){
  const v=document.getElementById('pwInput').value;
  if(v==='sowwa2026'){showScreen('start');}
  else{const e=document.getElementById('pwErr');e.textContent='合言葉が違います 🌿';setTimeout(()=>e.textContent='',2000);}
}
